<!-- 카카오톡·페이스북 등에 링크 공유할 때 미리보기로 쓰이는 정보 (글마다 따로!) -->

<!-- Pretendard 웹폰트 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<!-- Tailwind CSS (기존 홈페이지와 완전히 동일한 설정) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          warm: { bg: '#FDFCF8', card: '#FFFFFF' },
          ember: { DEFAULT: '#F97316', light: '#FDBA74', dark: '#C2410C' },
          sky: { DEFAULT: '#0EA5E9' },
          ink: { 900: '#2A2521', 700: '#4A423C', 500: '#8A8078' },
        },
        boxShadow: {
          soft: '0 10px 40px -12px rgba(42, 37, 33, 0.12)',
          card: '0 8px 30px -8px rgba(42, 37, 33, 0.10)',
        },
      },
    },
  };
</script>

<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Pretendard', ui-sans-serif, system-ui, sans-serif; background-color: #FDFCF8; color: #2A2521; }
  ::selection { background-color: #FDBA74; color: #2A2521; }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .reveal.in-view { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .reveal { transition: none; opacity: 1; transform: none; } }
</style>

<!-- ===== 다크모드: 기기(폰/패드/PC)의 시스템 설정을 그대로 따라감 (기존 홈페이지와 동일) ===== -->
<style>
  @media (prefers-color-scheme: dark) {
    html, body { background-color: #17130F !important; color: #EDE6DC !important; }
    .bg-warm-bg { background-color: #17130F !important; }
    .bg-warm-card, .bg-white { background-color: #221D17 !important; }
    .bg-white\/70, .bg-white\/80, .bg-white\/90, .bg-white\/95 { background-color: rgba(23,19,15,0.85) !important; }
    .bg-\[\#FBF6EE\] { background-color: #242423 !important; }
    .bg-\[\#FBF6EE\] .bg-warm-card, .bg-\[\#FBF6EE\] .bg-white { background-color: #2C2B29 !important; }
    .text-ink-900 { color: #F1EBE3 !important; }
    .text-ink-700 { color: #D8CCBF !important; }
    .text-ink-500 { color: #A79C8F !important; }
    .border-ink-900\/5, .border-ink-900\/10, .border-ink-900\/15 { border-color: rgba(255,255,255,0.12) !important; }
    .bg-ink-900\/5, .bg-ink-900\/10, .hover\:bg-ink-900\/10:hover { background-color: rgba(255,255,255,0.08) !important; }
    .hover\:bg-warm-bg:hover { background-color: rgba(255,255,255,0.06) !important; }
    input, textarea { color: #F1EBE3 !important; }
    input::placeholder, textarea::placeholder { color: #8A8078 !important; }
    .shadow-soft, .shadow-card { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5) !important; }
    ::selection { background-color: #C2410C; color: #F1EBE3; }
  }
</style>

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QTM6P3B9BK"></script>
<script>

</script>
</head>

<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  // 스크롤 리빌 애니메이션
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
