<section class="pt-12 pb-16 sm:pt-16 sm:pb-20 px-6">
  <div class="max-w-3xl mx-auto text-center mb-12">
    <p class="text-{{ accent }} text-xs font-bold tracking-[0.25em] uppercase mb-3">{{ eyebrow }}</p>
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink-900">{{ heading }}</h1>
    {% if subheading %}<p class="mt-4 text-ink-500 text-sm sm:text-base leading-relaxed max-w-xl mx-auto">{{ subheading }}</p>{% endif %}
  </div>

  <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 lg:gap-8">
    {% for item in items %}
    <a href="/{{ collection }}/{{ item.url_slug }}/" class="reveal in-view group text-left bg-warm-card rounded-3xl overflow-hidden shadow-card hover:shadow-soft transition-shadow duration-300 block">
      <div class="aspect-[4/3] overflow-hidden"><img loading="lazy" src="{{ item.image }}" alt="{{ item.title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" /></div>
      <div class="p-6">
        <span class="text-[11px] font-semibold text-{{ accent }} tracking-wide uppercase">{{ item.date_display }}</span>
        <h3 class="mt-2 font-bold text-lg leading-snug text-ink-900">{{ item.title }}</h3>
        <p class="mt-2 text-sm text-ink-500 leading-relaxed">{{ item.excerpt }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
