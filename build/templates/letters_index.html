<section class="pt-12 pb-16 sm:pt-16 sm:pb-20 px-6">
  <div class="max-w-3xl mx-auto text-center mb-12">
    <p class="text-violet-500 text-xs font-bold tracking-[0.25em] uppercase mb-3">Prayer Letter</p>
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink-900">기도 편지</h1>
  </div>

  <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 lg:gap-8">
    {% for letter in letters %}
    <a href="/letters/{{ letter.url_slug }}/" class="reveal in-view group text-left bg-warm-card rounded-3xl overflow-hidden shadow-card hover:shadow-soft transition-shadow duration-300 block">
      <div class="aspect-[4/3] overflow-hidden"><img loading="lazy" src="{{ letter.image }}" alt="{{ letter.title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" /></div>
      <div class="p-6">
        <span class="text-[11px] font-semibold text-violet-500 tracking-wide uppercase">{{ letter.date_display }}</span>
        <h3 class="mt-2 font-bold text-lg leading-snug text-ink-900">{{ letter.title }}</h3>
        <p class="mt-2 text-sm text-ink-500 leading-relaxed">{{ letter.excerpt }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
