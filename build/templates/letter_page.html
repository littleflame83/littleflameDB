<section class="pt-12 pb-20 sm:pt-16 px-6">
  <div class="max-w-3xl mx-auto">
    <a href="/letters/" class="inline-flex items-center gap-1.5 text-sm font-semibold text-ink-500 hover:text-ember transition-colors mb-6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      기도 편지 목록으로
    </a>

    <span class="text-[11px] font-semibold text-violet-500 tracking-wide uppercase">{{ letter.date_display }}</span>
    <h1 class="mt-2 mb-6 font-bold text-xl sm:text-2xl leading-snug text-ink-900">{{ letter.title }}</h1>
    <div class="aspect-[16/10] rounded-2xl overflow-hidden mb-6">
      <img loading="lazy" src="{{ letter.image }}" alt="{{ letter.title }}" class="w-full h-full object-cover" />
    </div>
    <div class="text-[15px]">
      {{ letter.body | safe }}
    </div>

    <div class="mt-10 pt-6 border-t border-ink-900/10 flex items-center justify-between">
      <a href="/letters/" class="text-sm font-semibold text-ink-700 hover:text-ember transition-colors">← 목록으로</a>
      <a href="javascript:void(0)" onclick="if(navigator.share){navigator.share({title:document.title,url:location.href})}else{navigator.clipboard.writeText(location.href);alert('링크가 복사되었습니다')}" class="text-sm font-semibold text-ink-700 hover:text-ember transition-colors">공유하기 ↗</a>
    </div>
  </div>
</section>
