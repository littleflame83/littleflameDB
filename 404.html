<meta name="robots" content="noindex, follow">
<style>
* { box-sizing: border-box; }
body {

  justify-content: center;
  background: #fdfcf8;

.links a {

  border: 1px solid rgba(42,37,33,.15);

  font-weight: 600;

.links a.primary {
  background: #f97316;
  border-color: #f97316;
  color: #fff;

@media (prefers-color-scheme: dark) {
  body { background: #17130f; color: #f2ede8; }
